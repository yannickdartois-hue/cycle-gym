<html lang="fr">
<head>
<meta charset="utf-8">

<title>Cycle gymnastique</title>
<!-- Page FABRIQUÉE par mon-eps/atelier/ecran-de-cours/construire.py : ne pas la modifier à la main ici.
     Moteur commun : ecran.js et ecran.css. Propre à l'activité : le <style> et le <script> ci-dessous. -->
<link rel="stylesheet" href="ecran.css">
<style>
/* ===== Propre au cycle gymnastique : couleurs, niveaux, schémas ===== */
:root{--sol:#ECEFEE; --craie:#FFFFFF; --encre:#172033; --repere:#5A6475; --trait:#D5DBDD;
  --ligne:#0F766E; --ligne-fonce:#09493F; --ligne-pale:#E2F1EF;
  --vert:#1D6B3A; --vert-pale:#E6F3EA; --alerte:#B42318; --alerte-pale:#FDE8E6;
  --facile:#2F6FB0; --facile-pale:#EAF2FB; --dur:#B4441C; --dur-pale:#FCEDE6;
  --d:"Archivo","Arial Narrow",Arial,sans-serif; --t:"Atkinson","Segoe UI",Roboto,Arial,sans-serif;
  --sur-encre:#FFFFFF; --fait:#9AA3AE;
  --c-p:#0F766E; --c-p-pale:#E2F1EF; --sur-niv:#FFFFFF;}
:root[data-theme="dark"]{
  --sol:#11161D; --craie:#1B222C; --encre:#E9EEF3; --repere:#9AA5B3; --trait:#323C49; --sur-encre:#11161D; --fait:#5B6573;
  --ligne:#5FC2B3; --ligne-fonce:#A7E0D7; --ligne-pale:#12302C;
  --vert:#6FD39F; --vert-pale:#15301F; --alerte:#FF8A80; --alerte-pale:#3A1A18;
  --facile:#7FB0E8; --facile-pale:#162638; --dur:#F29470; --dur-pale:#3A2018;
  --c-p:#5FC2B3; --c-p-pale:#12302C; --sur-niv:#11161D; color-scheme:dark}
.schema{background:#EEF1F0;border-radius:14px;padding:8px;color:#172033}
.c-gym{fill:#EEF1F0}
.c-gymline{stroke:#C9D0D3;stroke-width:2;fill:none}
.c-floor{fill:#FFFFFF}
.c-line{stroke:#F2A900;stroke-width:5;fill:none}
.c-att{stroke:#F2A900;stroke-width:3;fill:none}
.c-net{stroke:#172033;stroke-width:6}
.c-zone{fill:#F2A900;fill-opacity:.22;stroke:#8A5A00;stroke-width:1.5;stroke-dasharray:6 4}
.c-zonet{fill:#8A5A00;font:700 max(13px,var(--fs-min,15px)) var(--t)}
.c-target{fill:#F2A900;fill-opacity:.3;stroke:#8A5A00;stroke-width:1.5}
.c-cone{fill:#E8590C}
.c-pa{fill:#2F6FB0}
.c-pb{fill:#C2410C}
.c-pn{fill:#5A6475}
.c-pt{fill:#fff;font:800 16px var(--d);text-anchor:middle;dominant-baseline:central}
.c-ball{stroke:#172033;stroke-width:2.5;stroke-dasharray:8 5;fill:none}
.c-run{stroke:#172033;stroke-width:3;fill:none}
.c-head-b,.c-head-r{fill:#172033}
.c-label{fill:#172033;font:700 max(13px,var(--fs-min,15px)) var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.c-say{fill:#172033;font:italic 700 max(13px,var(--fs-min,15px)) var(--t);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.c-shadow{fill:#172033;fill-opacity:.07}
.c-ordre circle{fill:#F2A900;stroke:#fff;stroke-width:2}
.c-ordre text{fill:#172033;font:800 15px var(--d);text-anchor:middle;dominant-baseline:central}
.legende{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 0;font-size:max(14px,var(--fs-min,15px));color:var(--repere)}
.legende span{display:inline-flex;align-items:center;gap:6px}
.legende i{display:inline-block;flex:none}
.legende .rond{width:14px;height:14px;border-radius:50%}
.legende .pt{width:24px;border-top:2.5px dashed currentColor}
.legende .tr{width:24px;border-top:3px solid currentColor}
.legende .num{width:18px;height:18px;border-radius:50%;background:#F2A900;color:#172033;font:800 max(12px,var(--fs-min,15px))/18px var(--d);text-align:center;font-style:normal}
.defi{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--ligne-pale);font-size:17px}
.defi b{color:var(--ligne-fonce)}

/* Danse : schémas (styles injectés par danse-donnees.js), pastille du mode de passage */
.passage{display:inline-grid;place-items:center;font:700 max(14px,var(--fs-min,15px)) var(--t);padding:4px 10px;border-radius:999px;background:var(--ligne-pale);color:var(--ligne-fonce)}
.dz{margin-top:4px}
/* Pictos des niveaux (images de l'appli élève) et lettres A à F aux couleurs de la fiche papier */
.pictos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pictos figure{margin:0;background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:8px;text-align:center}
.pictos img{max-width:100%;height:110px;object-fit:contain}
.pictos figcaption{font-size:max(14px,var(--fs-min,15px));line-height:1.3;color:#1c2128}
.L{display:inline-block;min-width:1.6em;border-radius:6px;padding:0 4px;font-weight:800;text-align:center}
.LA{background:#ff0000;color:#fff}.LB{background:#ec7c30;color:#000}.LC{background:#ffc000;color:#000}.LD{background:#ffff00;color:#000}.LE{background:#92d050;color:#000}.LF{background:#00af50;color:#000}
/* Exercices illustrés (EvoluGym) et photos des fiches Access Gym (FFG) */
.exos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.exo{margin:0;background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;color:#1c2128}
.exo img{width:100%;height:130px;object-fit:contain;background:#fff}
.exo figcaption{font-size:max(14px,var(--fs-min,15px));line-height:1.35}.exo figcaption b{display:block;font-size:max(16px,var(--fs-min,15px))}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-bottom:10px}
.photos figure{margin:0;background:#fff;border:1px solid #dde2e8;border-radius:12px;overflow:hidden}
.photos img{width:100%;display:block}.photos figcaption{padding:6px 10px;font-size:max(14px,var(--fs-min,15px));color:#1c2128}
@media print{.exo img{height:90px}}
</style>
<style>/* Lisibilité terrain : textes à 15 px minimum à l'écran ; tailles d'origine à l'impression. */@media print{:root{--fs-min:0px}}</style>
<link rel="stylesheet" href="eps-charte-v1.css">
<style>/* Charte v1 : couleur de l'activité et teinte de chaque cycle (calculées par construire.py) */
:root{--act:#0f766e;--act-fonce:#094944;--act-pale:#e2efee;--act-sombre:#7bb4af;--act-pale-sombre:#142f33}
:root{--c-p:#0f766e;--c-p-pale:#e2efee}
body.niv-p{--niv:#0f766e;--sur-niv:#ffffff;--niv-pale:var(--act-pale)}
:root[data-theme="dark"] body.niv-p{--niv:#4b9892;--sur-niv:#0d1117}
.cy button[data-cy=p].on{background:#0f766e;color:#ffffff}
:root[data-theme="dark"] .cy button[data-cy=p].on{background:#4b9892;color:#0d1117}
.pc.niv-p .sc.jour{outline-color:var(--ligne)}
.pc.niv-p{--nivp:#0f766e}
</style>
</head>
<body>
<header class="barre">
  <img src="icon-192.png" alt="">
  <div class="app">Gymnastique<small>Lycée Pompidou</small></div>
  <span class="pastille-niv" id="cyPast">1re</span>
  <div class="titre" id="titre"></div>
  <a class="bt clair" href="https://yannickdartois-hue.github.io/gym-eleves/">Appli élève</a>
  <a class="bt clair" href="https://yannickdartois-hue.github.io/gym-prof/">Outil prof</a>
  <a class="bt clair" id="prep" href="outils.html">Préparer</a>
  <button class="bt clair baide" type="button" onclick="EPSAide.ouvrir()" aria-label="Mode d’emploi" title="Mode d’emploi">?</button>
</header>
<div class="trace"></div>
<div class="niveau" id="niveau"></div>
<section class="deroule" id="deroule" aria-label="Déroulé de la séance"></section>
<main class="zone" id="zone"></main>
<footer class="pouce">
  <button class="bt bord" id="btSeances" type="button">‹ Séances</button>
  <button class="bt bord" id="btOutils" type="button">Outils</button>
  <button class="bt bord" id="btAjuster" type="button">Ajuster le déroulé</button>
  <div class="info" id="info"></div>
</footer>
<div id="couche"></div>

<script src="gym-donnees.js"></script>
<script>
'use strict';
/* Écran de cours — gymnastique : ce qui est propre à l'activité.
   Source : mon-eps/atelier/ecran-de-cours/apps/. Le moteur commun est ecran.js. */
/* Le cycle de gymnastique tient en un niveau (Première). Chaque séance garde son déroulé (tl) et ses fiches. */
const courtG=t=>String(t||'').split(/\s:\s|\s·\s/)[0];
const convG=f=>({t:f.titre,k:f.cat,disp:f.dispo,four:f.roles,deroul:f.deroul||[],cons:f.crit?[f.crit]:[],reus:f.reussite,moins:f.moins,plus:f.plus,spec:f.schema});
const GYMC=SEANCES.map(S=>({id:S.id.toLowerCase(),n:S.id,title:S.titre,short:courtG(S.titre),obj:S.obj,prepare:S.prepare||[],install:S.install,bilan:S.bilan,
  tl:S.tl.map(t=>[t[0],String(t[1]),t[2]]),ex:S.fiches.map(convG),evalPage:false,status:/validations et bilan/i.test(S.titre)?'eval':''}));
const APP={
  old:'outils.html',
  cle:'gy',
  niv:{p:{label:'Première',court:'1re',long:'PREMIÈRE',L:GYMC}},
  defaut:'p',
  lienOld:()=>APP.old,
  lireCur(){const j=lire('gym1re_jour',-1);return {p:j>=0&&GYMC[j]?GYMC[j].id:''}},
  marquerJour(c,id){const j=GYMC.findIndex(s=>s.id===id);if(j<0)return;ecrire('gym1re_jour',j);CUR.p=id},
  outils:[{"titre":"Pendant le cours","items":[["ateliers","Ateliers et niveaux","A à F, critères, ⚠️"],["installation","Installation","matériel, plan, rotation"],["echauff","Échauffements","les 8 et la banque"]]},
          {"titre":"Sécurité","items":[["securite","Règles","zones clés, postures"],["parade","Parade et aide","quand, où, comment"]]},
          {"titre":"Valider","items":[["validation","Validation E et P","règles, note 16 + 4"],["sources","Repères et sources","pour préparer"]]}],
  urlOutil:id=>APP.old+'#tab-'+id,
  racc:[[/parade|pareur|parer/i,'parade','Parade et aide'],[/rotation|atelier/i,'installation','Installation et rotation'],[/validation|valide|« Montrer au professeur »/i,'validation','Validation E et P'],[/échauffement|zones clés/i,'echauff','Échauffements'],[/niveau|⚠️/i,'ateliers','Ateliers et niveaux']],
  schemaDe:e=>{if(!e||!e.spec)return '';return schema(e.spec)},
  /* l'installation : un bloc d'information, sans fiche */
  plan(c,id){
    const s=sea(c,id);if(!s)return [];
    let fi=0;
    return s.tl.map(t=>{const typ=t[2],dur=+t[1];
      if(typ==='acc'||typ==='inst')return {k:'info',typ,label:t[0],court:'Install.',dur};
      const e=s.ex[fi],lab=e?courtG(e.t):t[0];
      return {k:'ex',typ,ref:{c,id,i:fi++},label:lab,dur}})
     .map(x=>(x.orig=x.dur,x.st='todo',x));
  },
  blocInfo(b,s,i){
    const mat=`<h2 class="rub">Chaque groupe installe son atelier</h2><ul class="org">${ATELIERS.map(a=>`<li><b>${a.n}. ${esc(a.court)}</b> : ${esc(a.mat.join(' ; '))}</li>`).join('')}</ul>`;
    return `${i===0?`<h2 class="rub">Objectif de la séance</h2><p class="texte">${esc(s.obj)}</p>`:''}${s.install?`<h2 class="rub">Installation</h2>${orgHTML(s.install)}`:''}${i===0?mat:''}${s.prepare.length&&i===0?`<h2 class="rub">Ce que la séance prépare</h2><ul class="org">${s.prepare.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${i>0?`<h2 class="rub">Rangement</h2><p class="texte">Chaque groupe range SON atelier : tapis empilés par taille, rien ne reste sur le praticable.</p>`:''}`},
  bascule:s=>''
};
</script>
<script src="ecran.js"></script>
<script src="aide-ecran.js"></script>
